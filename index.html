<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Klankleer 1 – Oefenen</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- De vaste balk bovenaan: links de titel, rechts de tabbladen (die vult js/app.js in). -->
    <header>
      <h1><a id="brand" href="#/">Klankleer 1</a></h1>
      <nav class="tabs" id="nav"></nav>
    </header>

    <!-- Hier tekent JavaScript de pagina die bij het adres hoort: Home, Oefenen, Voortgang, enzovoort. -->
    <div class="wrap">
      <main><div class="page" id="page"></div></main>
    </div>

    <!--
      De scripts. De volgorde is belangrijk: een bestand kan alleen gebruiken
      wat in een eerder bestand is gemaakt. In README.md staat wat elk bestand doet.
    -->

    <!-- 1. De vragen (dit bestand wordt gemaakt door het bouwscript) -->
    <script src="js/data.js"></script>

    <!-- 2. Algemene onderdelen -->
    <script src="js/helpers.js"></script>
    <script src="js/colleges.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/results.js"></script>
    <script src="js/checking.js"></script>
    <script src="js/slides.js"></script>

    <!-- 3. De vraagsoorten: eerst het gezamenlijke deel, dan één bestand per soort -->
    <script src="js/questions/question.js"></script>
    <script src="js/questions/card.js"></script>
    <script src="js/questions/cloze.js"></script>
    <script src="js/questions/blanks.js"></script>
    <script src="js/questions/mc.js"></script>
    <script src="js/questions/click.js"></script>
    <script src="js/questions/ipa.js"></script>
    <script src="js/questions/drag.js"></script>

    <!-- 4. De pagina's -->
    <script src="js/pages/shared.js"></script>
    <script src="js/pages/home.js"></script>
    <script src="js/pages/slides-dialog.js"></script>
    <script src="js/pages/backup.js"></script>
    <script src="js/pages/overview.js"></script>
    <script src="js/pages/progress.js"></script>
    <script src="js/pages/new-round.js"></script>
    <script src="js/pages/practice.js"></script>
    <script src="js/pages/review.js"></script>
    <script src="js/pages/single.js"></script>

    <!-- 5. Het startpunt: kiest de pagina bij het adres en tekent hem -->
    <script src="js/app.js"></script>
  </body>
</html>
