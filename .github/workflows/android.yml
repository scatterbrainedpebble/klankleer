# android.yml – bouwt de Android-app (APK) op de computers van GitHub.
#
# Wanneer:  bij elke wijziging in de map android/ (ook in een pull request),
#           of met de hand via het tabblad Actions > Android-app > Run workflow.
# Resultaat: de APK staat als 'artifact' bij de run (tabblad Actions).
#           Na een merge naar main komt hij ook bij Releases, onder 'Klankleer-app',
#           met een vaste downloadlink (zie android/README.md).

name: Android-app

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write # nodig om de APK bij Releases te zetten

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # versionCode = het nummer van deze run, zodat elke nieuwe APK als update geïnstalleerd kan worden.
      - name: APK bouwen
        run: gradle -p android assembleRelease -PversionCode=${{ github.run_number }}

      - name: APK een duidelijke naam geven
        run: cp android/app/build/outputs/apk/release/app-release.apk klankleer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: klankleer-apk
          path: klankleer.apk

      - name: APK bij Releases zetten (alleen op main)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app --yes --cleanup-tag || true
          gh release create app klankleer.apk \
            --title "Klankleer-app" \
            --notes "Nieuwste versie van de Android-app (build ${{ github.run_number }}). Installeren: zie android/README.md."
